<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>정답 찾기</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        h1 { font-size: 1.4rem; text-align: center; color: #111; margin-bottom: 5px; }
        .date { text-align: center; color: #666; font-size: 0.9rem; margin-bottom: 20px; }
        .quiz-card { background: #f8f9fa; border-left: 4px solid #4f46e5; padding: 12px 15px; margin-bottom: 10px; border-radius: 0 8px 8px 0; display: flex; justify-content: space-between; align-items: center; }
        .app-name { font-weight: bold; color: #4f46e5; }
        .answer { background: #e0e7ff; color: #3730a3; padding: 4px 10px; border-radius: 20px; font-weight: bold; font-size: 0.95rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 정답 찾기</h1>
        <div class="date">2026년 10월 28일 09시 02분 업데이트</div>
        
        <div id="quiz-list">
            <div class="quiz-card">
                <span class="app-name">토스 / 캐시워크 / KB Pay</span>
                <span class="answer">뉴스 힌트: 캐시워크 돈버는퀴즈 10월 26일 정답은?</span>
            </div>
        </div>
    </div>
</body>
</html>
